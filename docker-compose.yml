services:
  nemotron-stt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: nemotron-stt-service
    ports:
      - "8099:8099"
    volumes:
      - ./torchscript_model:/app/torchscript_model:ro
      - ./audio:/app/audio:ro
    environment:
      - RUST_LOG=info
      - MODEL_PATH=/app/torchscript_model
      - PORT=8099
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # CPU service for local execution with pre-downloaded libtorch in scratch/
  nemotron-stt-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: nemotron-stt-service-cpu
    ports:
      - "8099:8099"
    volumes:
      - ./audio:/app/audio:ro
    environment:
      - RUST_LOG=info
      - MODEL_PATH=/app/torchscript_model
      - PORT=8099
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
