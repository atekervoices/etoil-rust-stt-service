services:
  nemotron-stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemotron-stt-service
    ports:
      - "8099:8099"
    volumes:
      # Model is baked directly into the image at /app/nemotron-3.5-asr-streaming-0.6b-onnx!
      # Optional: Uncomment below only if you wish to override with external host weights:
      # - ./nemotron-3.5-asr-streaming-0.6b-onnx:/app/nemotron-3.5-asr-streaming-0.6b-onnx:ro
      - ./audio:/app/audio:ro
    environment:
      - RUST_LOG=info
      - MODEL_PATH=/app/nemotron-3.5-asr-streaming-0.6b-onnx
      - PORT=8099
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ORT_CUDA_VERSION=12
      - LD_LIBRARY_PATH=/app:/usr/local/cuda/lib64:/usr/local/cuda/compat:/usr/local/lib
    # GPU support (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # CPU-only alternative (uncomment if running without NVIDIA GPU)
  # crane-nemotron-stt-cpu:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.cpu
  #   container_name: crane-nemotron-stt-service-cpu
  #   ports:
  #     - "8099:8099"
  #   volumes:
  #     # Model is baked into image. Uncomment only to override with external host weights:
  #     # - ./crane-nemo-asr-1.1-onnx:/app/crane-nemo-asr-1.1-onnx:ro
  #     - ./audio:/app/audio:ro
  #   environment:
  #     - RUST_LOG=info
  #     - MODEL_PATH=/app/crane-nemo-asr-1.1-onnx
  #     - PORT=8099
  #   restart: unless-stopped
