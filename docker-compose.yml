version: '3.8'

services:
  crane-nemotron-stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crane-nemotron-stt-service
    ports:
      - "8080:8080"
    volumes:
      # Model is baked directly into the image at /app/crane-nemo-asr-1.1-onnx!
      # Optional: Uncomment below only if you wish to override with external host weights:
      # - ./crane-nemo-asr-1.1-onnx:/app/crane-nemo-asr-1.1-onnx:ro
      - ./audio:/app/audio:ro
    environment:
      - RUST_LOG=info
      - MODEL_PATH=/app/crane-nemo-asr-1.1-onnx
      - PORT=8080
    # GPU support (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # CPU-only alternative (uncomment if running without NVIDIA GPU)
  # crane-nemotron-stt-cpu:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.cpu
  #   container_name: crane-nemotron-stt-service-cpu
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     # Model is baked into image. Uncomment only to override with external host weights:
  #     # - ./crane-nemo-asr-1.1-onnx:/app/crane-nemo-asr-1.1-onnx:ro
  #     - ./audio:/app/audio:ro
  #   environment:
  #     - RUST_LOG=info
  #     - MODEL_PATH=/app/crane-nemo-asr-1.1-onnx
  #     - PORT=8080
  #   restart: unless-stopped
