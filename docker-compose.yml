services:
  nemotron-stt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HF_TOKEN=${HF_TOKEN:-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}
    container_name: nemotron-stt-service
    ports:
      - "8099:8099"
    volumes:
      # Model is baked directly into the image at /app/nemotron-3.5-asr-streaming-luganda-onnx!
      # Optional: Uncomment below only if you wish to override with external host weights:
      # - ./nemotron-3.5-asr-streaming-luganda-onnx:/app/nemotron-3.5-asr-streaming-luganda-onnx:ro
      - ./audio:/app/audio:ro
    environment:
      - RUST_LOG=info
      - MODEL_PATH=/app/nemotron-3.5-asr-streaming-luganda-onnx
      - PORT=8099
      - HF_TOKEN=${HF_TOKEN:-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}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/app:/usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/local/cuda/lib64:/usr/local/cuda-13.0/lib64:/usr/lib/x86_64-linux-gnu:/usr/local/lib
    # GPU support (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # CPU service for local execution on machines without NVIDIA GPU
  nemotron-stt-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        - HF_TOKEN=${HF_TOKEN:-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}
    container_name: nemotron-stt-service-cpu
    ports:
      - "8099:8099"
    volumes:
      - ./audio:/app/audio:ro
    environment:
      - RUST_LOG=info
      - MODEL_PATH=/app/nemotron-3.5-asr-streaming-luganda-onnx
      - PORT=8099
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
