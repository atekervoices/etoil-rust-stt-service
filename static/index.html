<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemotron 3.5 Streaming ASR</title>
</head>
<body>
    <header>
        <h1>etoil-rust-stt-service</h1>
        <p>NVIDIA Nemotron 3.5 Streaming ASR (FastConformer RNN-T 0.6B)</p>
        <p>Status: <strong id="wsStatusText">Disconnected</strong></p>
    </header>
    <hr>

    <main>
        <div>
            <label for="langSelect">Target Language: </label>
            <select id="langSelect">
                <option value="en-gb" selected>English (UK / Commonwealth / East Africa) - en-GB</option>
                <option value="en">English (US) - en-US</option>
                <option value="es">Spanish (Español) - es-ES</option>
                <option value="fr">French (Français) - fr-FR</option>
                <option value="de">German (Deutsch) - de-DE</option>
                <option value="it">Italian (Italiano) - it-IT</option>
                <option value="pt">Portuguese (Português) - pt-BR</option>
                <option value="ru">Russian (Русский) - ru-RU</option>
                <option value="zh">Chinese (Mandarin) - zh-CN</option>
                <option value="ja">Japanese (日本語) - ja-JP</option>
                <option value="ko">Korean (한국어) - ko-KR</option>
                <option value="hi">Hindi (हिन्दी) - hi-IN</option>
                <option value="ar">Arabic (العربية) - ar-AR</option>
                <option value="tr">Turkish (Türkçe) - tr-TR</option>
                <option value="vi">Vietnamese (Tiếng Việt) - vi-VN</option>
                <option value="sw">Swahili (Kiswahili) - sw-KE</option>
                <option value="auto">Auto-Detect (auto)</option>
            </select>
        </div>
        <br>

        <div>
            <button id="startMicBtn">Start Microphone</button>
            <button id="stopMicBtn" disabled>Stop Microphone</button>
            <button id="clearBtn">Clear Transcript</button>
        </div>
        <br>

        <div>
            <canvas id="waveform" width="600" height="50" style="border: 1px solid #999; display: block;"></canvas>
        </div>
        <br>

        <div>
            <p>
                <strong>Chunk Size:</strong> 560 ms | 
                <strong>Sample Rate:</strong> 16,000 Hz | 
                <strong>Samples / Chunk:</strong> 8,960 | 
                <strong>Active Language:</strong> <span id="activeLangDisplay">en-gb</span>
            </p>
        </div>

        <div>
            <h3>Transcription Stream</h3>
            <div id="transcriptBox" style="border: 1px solid #999; padding: 12px; min-height: 120px; max-height: 400px; overflow-y: auto; font-family: monospace;">
                <span id="placeholder" style="color: #666;">Click "Start Microphone" and speak...</span>
                <span id="confirmedText"></span>
                <span id="partialText" style="color: #0066cc;"></span>
            </div>
        </div>
    </main>

    <script>
        const wsStatusText = document.getElementById('wsStatusText');
        const startMicBtn = document.getElementById('startMicBtn');
        const stopMicBtn = document.getElementById('stopMicBtn');
        const langSelect = document.getElementById('langSelect');
        const activeLangDisplay = document.getElementById('activeLangDisplay');
        const confirmedText = document.getElementById('confirmedText');
        const partialText = document.getElementById('partialText');
        const placeholder = document.getElementById('placeholder');
        const clearBtn = document.getElementById('clearBtn');
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');

        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let isRecording = false;

        const CHUNK_SIZE = 8960; // 560ms at 16kHz

        function connectWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const lang = langSelect.value;
            const wsUrl = `${proto}//${window.location.host}/v1/realtime?language=${lang}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatusText.textContent = 'Connected (Nemotron Ready)';
                sendConfig();
            };

            ws.onclose = () => {
                wsStatusText.textContent = 'Disconnected';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (e) => {
                console.error('WebSocket Error:', e);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleServerMessage(msg);
                } catch (e) {
                    console.error('Failed to parse WS msg:', e);
                }
            };
        }

        function sendConfig() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const lang = langSelect.value;
                activeLangDisplay.textContent = lang;
                ws.send(JSON.stringify({
                    type: 'config',
                    language: lang,
                    sample_rate: 16000
                }));
            }
        }

        langSelect.addEventListener('change', () => {
            sendConfig();
        });

        clearBtn.addEventListener('click', () => {
            confirmedText.textContent = '';
            partialText.textContent = '';
            placeholder.style.display = 'inline';
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset' }));
            }
        });

        function downsampleTo16k(buffer, inputSampleRate) {
            if (inputSampleRate === 16000) {
                return buffer;
            }
            const ratio = inputSampleRate / 16000;
            const newLength = Math.round(buffer.length / ratio);
            const result = new Float32Array(newLength);
            for (let i = 0; i < newLength; i++) {
                const srcIdx = i * ratio;
                const idx0 = Math.floor(srcIdx);
                const frac = srcIdx - idx0;
                const s0 = buffer[idx0] || 0;
                const s1 = buffer[idx0 + 1] !== undefined ? buffer[idx0 + 1] : s0;
                result[i] = s0 + frac * (s1 - s0);
            }
            return result;
        }

        function handleServerMessage(msg) {
            const transcriptBox = document.getElementById('transcriptBox');
            if (msg.type === 'ready') {
                console.log('Model ready:', msg);
            } else if (msg.type === 'transcript') {
                placeholder.style.display = 'none';
                if (!msg.is_final) {
                    partialText.textContent = msg.text ? (' ' + msg.text.trim()) : '';
                } else {
                    partialText.textContent = '';
                    const newText = msg.text ? msg.text.trim() : '';
                    if (newText) {
                        const current = confirmedText.textContent.trim();
                        confirmedText.textContent = current ? (current + ' ' + newText) : newText;
                    }
                }
                if (transcriptBox) transcriptBox.scrollTop = transcriptBox.scrollHeight;
            } else if (msg.type === 'error') {
                console.error('Server error:', msg.message);
                alert('STT Server error: ' + msg.message);
            }
        }

        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                } catch (e) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const actualSampleRate = audioContext.sampleRate;
                console.log(`AudioContext initialized at sampleRate: ${actualSampleRate} Hz`);

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                source.connect(processor);

                // Mute destination to prevent mic-to-speaker feedback
                const muteNode = audioContext.createGain();
                muteNode.gain.value = 0.0;
                processor.connect(muteNode);
                muteNode.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    drawWaveform(inputData);

                    // Downsample to 16,000 Hz if hardware is 44.1k/48k
                    const resampled16k = downsampleTo16k(inputData, actualSampleRate);

                    // Convert float32 to int16 PCM
                    const pcm16 = new Int16Array(resampled16k.length);
                    for (let i = 0; i < resampled16k.length; i++) {
                        const s = Math.max(-1, Math.min(1, resampled16k[i]));
                        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }

                    // Direct binary PCM streaming to server
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(pcm16.buffer);
                    }
                };

                isRecording = true;
                startMicBtn.disabled = true;
                stopMicBtn.disabled = false;
                placeholder.style.display = 'none';
            } catch (err) {
                console.error('Error accessing microphone:', err);
                alert('Microphone access failed: ' + err.message);
            }
        }

        function stopRecording() {
            isRecording = false;
            startMicBtn.disabled = false;
            stopMicBtn.disabled = true;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'flush' }));
            }

            if (processor) processor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioContext) audioContext.close();
            clearWaveform();
        }

        startMicBtn.addEventListener('click', startRecording);
        stopMicBtn.addEventListener('click', stopRecording);

        function drawWaveform(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#0066cc';
            ctx.beginPath();

            const sliceWidth = canvas.width / data.length;
            let x = 0;

            for (let i = 0; i < data.length; i++) {
                const v = data[i] * 2;
                const y = (canvas.height / 2) + (v * canvas.height / 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }

            ctx.stroke();
        }

        function clearWaveform() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        connectWebSocket();
    </script>
</body>
</html>
